# Lotus Docs landing page. Blocks render in ascending `weight` order.

hero:
  enable: true
  weight: 10
  template: hero

  badge:
    text: "Open, practical, free"
    color: primary
    pill: true
    soft: true

  title: "Tools that give you your day back"
  subtitle: "A hands-on guide to the tools that cut the repetition out of IT work — terminals, search, editors, AI assistants, Git, APIs, containers, automation, and the free-tier stack you ship on. Every page follows the same shape: **why it matters → how to install it → the handful of commands you'll actually use.** Five minutes each."

  image:
    path: "images"
    filename: "hero-terminal.svg"
    alt: "A terminal window with a fuzzy-finder command palette open over a project"

  ctaButton:
    icon: rocket_launch
    btnText: "Browse the docs"
    url: "/docs/"
  cta2Button:
    icon: hub
    btnText: "View on GitHub"
    url: "https://github.com/jeonck/toolian"

  info: "**MIT licensed.** Every page is plain Markdown — fork it, adapt it, drop it into your own handbook."

featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: "Fifteen categories, one hundred and twenty tools"
  subtitle: "Start wherever your friction is. Read straight through and you go from an empty terminal to a deployed, observable product that takes payments."

  items:
    - title: "Getting Started"
      icon: "rocket_launch"
      description: "How to pick a tool worth installing, package managers on every OS, and keeping your config in dotfiles."
      ctaLink:
        text: browse
        url: /docs/getting-started/

    - title: "Terminal & Shell"
      icon: "terminal"
      description: "Terminal apps, zsh with Starship, tmux sessions, fzf fuzzy finding, zoxide for jumping between directories, and hyperfine for benchmarking."
      ctaLink:
        text: browse
        url: /docs/terminal/

    - title: "Files & Search"
      icon: "search"
      description: "ripgrep, fd, bat, eza, and jq — modern replacements for grep, find, cat, and ls — plus ast-grep for code structure and MinerU or Docling for documents."
      ctaLink:
        text: browse
        url: /docs/files/

    - title: "Editors & IDEs"
      icon: "code"
      description: "The first settings that matter in VS Code, Neovim, and JetBrains, plus editing skills that survive a switch."
      ctaLink:
        text: browse
        url: /docs/editor/

    - title: "AI Coding Tools"
      icon: "auto_awesome"
      description: "Claude Code, Copilot, Cursor, and Ollama, plus the layer around them: Graft, Codebase Memory MCP, Agency Agents, OpenMontage, HyperFrames, Composio, Exa."
      ctaLink:
        text: browse
        url: /docs/ai/

    - title: "Git & Collaboration"
      icon: "hub"
      description: "A real daily Git workflow including how to undo things, plus gh, Gitea, Forgejo and GitLab for a forge you host yourself, lazygit, delta, hunk, and pre-commit hooks."
      ctaLink:
        text: browse
        url: /docs/git/

    - title: "Network & APIs"
      icon: "api"
      description: "curl, HTTPie, Bruno and Postman, opening a local server to the internet, and AutoCLI for pulling data out of sites."
      ctaLink:
        text: browse
        url: /docs/network/

    - title: "Containers & Deploys"
      icon: "deployed_code"
      description: "Docker and Podman, Kubernetes with Helm, Kustomize, Istio and policy, six CI/CD tools, Nexus and Harbor, Terraform and Ansible, secrets, scanning, and Backstage."
      ctaLink:
        text: browse
        url: /docs/devops/

    - title: "Observability & Reliability"
      icon: "monitoring"
      description: "Prometheus, Grafana, Loki and OpenTelemetry for the four signals, k6 for load tests, chaos experiments, and OpenCost for the bill."
      ctaLink:
        text: browse
        url: /docs/observability/

    - title: "Security"
      icon: "shield"
      description: "Semgrep for source patterns, gitleaks for secrets, Sigstore for signing, ZAP against the running app, and Wazuh watching the hosts."
      ctaLink:
        text: browse
        url: /docs/security/

    - title: "Automation & Shortcuts"
      icon: "bolt"
      description: "Raycast, PowerToys, Makefiles, cron and launchd, and n8n for wiring services together."
      ctaLink:
        text: browse
        url: /docs/automation/

    - title: "Linux Desktop"
      icon: "desktop_windows"
      description: "Zen Browser for the days that end with forty tabs, Webapp Manager to make websites real apps, and Zathura for reading PDFs from the keyboard."
      ctaLink:
        text: browse
        url: /docs/linux-desktop/

    - title: "Docs & Notes"
      icon: "description"
      description: "Obsidian and Joplin, the Markdown you actually need, Mermaid diagrams that live in your diffs, Excalidraw, and two AI office suites — GenOffice and BatiOffice."
      ctaLink:
        text: browse
        url: /docs/writing/

    - title: "Vibe Coding Infra"
      icon: "cloud"
      description: "The free-tier stack behind a solo-built product: Railway and Fly.io, Vercel and Workers, Neon and Supabase, Upstash, R2, Clerk, Resend, Inngest, PostHog, and getting paid."
      ctaLink:
        text: browse
        url: /docs/vibe-infra/

    - title: "AI Media Tools"
      icon: "palette"
      description: "Browser tools for the assets a project needs: Raphael and Krea for images, Magnific for upscaling, Clipdrop for edits, ElevenLabs for voice."
      ctaLink:
        text: browse
        url: /docs/ai-media/

# The theme ships its own data/landing.yaml, and Hugo merges a module's data
# directory into the site's. Without switching this off explicitly, the Lotus
# Docs demo comparison slider stays on our homepage.
imageCompare:
  enable: false
  weight: 30
  template: image compare
