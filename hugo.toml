baseURL = "https://toolian.metacog.co.kr/"
locale = "ko-kr"
title = "Toolian"
contentDir = "content"
enableEmoji = true
enableGitInfo = true

defaultContentLanguage = "ko"
[languages]
  [languages.ko]
    title = "Toolian"
    label = "한국어"
    weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.100.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]
  sans_serif_font = "Inter"
  secondary_font  = "Inter"
  mono_font       = "Fira Code"

  [params.footer]
    copyright = "© :YEAR: Toolian. Built with [**Lotus Docs**](https://github.com/colinwilson/lotusdocs)"

  [params.social]
    github = "https://github.com/jeonck/toolian"

  [params.docs]
    title           = "Toolian"
    darkMode        = true
    prism           = true
    prismTheme      = "lotusdocs"

    repoURL         = "https://github.com/jeonck/toolian"
    repoBranch      = "main"
    editPage        = true
    lastMod         = true
    lastModRelative = true

    sidebarIcons    = true
    breadcrumbs     = true
    backToTop       = true

    toc             = true
    tocMobile       = true
    scrollSpy       = true

    descriptions    = true
    titleIcon       = true

    navDesc         = true
    navDescTrunc    = 30
    listDescTrunc   = 140

    intLinkTooltip  = true

  [params.flexsearch]
    enabled = true

[menu]
[[menu.primary]]
  name       = "문서"
  url        = "docs/"
  identifier = "docs"
  weight     = 10
[[menu.primary]]
  name       = "빠른 시작"
  url        = "docs/getting-started/"
  identifier = "start"
  weight     = 20
