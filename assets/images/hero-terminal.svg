<svg viewBox="0 0 560 400" width="560" height="400" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="A terminal window running a fuzzy-finder command palette over a project tree">
  <defs>
    <linearGradient id="tlCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c2f"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="tlPalette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="100%" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="tlAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tlGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="tlShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1020" flood-opacity="0.45"/>
    </filter>
    <filter id="tlShadowSm" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1020" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tlClip">
      <rect x="36" y="26" width="488" height="286" rx="14"/>
    </clipPath>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="330" cy="150" rx="240" ry="150" fill="url(#tlGlow)"/>

  <!-- terminal window -->
  <g filter="url(#tlShadow)">
    <rect x="36" y="26" width="488" height="286" rx="14" fill="url(#tlCard)"/>
    <rect x="36" y="26" width="488" height="286" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>

  <g clip-path="url(#tlClip)">
    <!-- title bar -->
    <rect x="36" y="26" width="488" height="38" fill="#0d1426"/>
    <line x1="36" y1="64" x2="524" y2="64" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="58" cy="45" r="5" fill="#ff5f57"/>
    <circle cx="76" cy="45" r="5" fill="#febc2e"/>
    <circle cx="94" cy="45" r="5" fill="#28c840"/>
    <rect x="118" y="37" width="96" height="16" rx="6" fill="#1e2942"/>
    <rect x="126" y="43" width="58" height="4" rx="2" fill="#4a5a7d"/>
    <rect x="222" y="37" width="72" height="16" rx="6" fill="#161f36"/>
    <rect x="230" y="43" width="42" height="4" rx="2" fill="#2f3c5c"/>

    <!-- prompt line 1 -->
    <text x="60" y="97" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4ade80">❯</text>
    <rect x="76" y="90" width="52" height="8" rx="4" fill="#7dd3fc"/>
    <rect x="136" y="90" width="88" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.75"/>
    <rect x="232" y="90" width="40" height="8" rx="4" fill="#64748b"/>

    <!-- output rows -->
    <rect x="60" y="116" width="188" height="7" rx="3.5" fill="#33415c" fill-opacity="0.85"/>
    <rect x="60" y="133" width="252" height="7" rx="3.5" fill="#2b3750" fill-opacity="0.85"/>
    <rect x="60" y="150" width="146" height="7" rx="3.5" fill="#2b3750" fill-opacity="0.7"/>

    <!-- accent progress -->
    <rect x="60" y="172" width="404" height="6" rx="3" fill="#1c2740"/>
    <rect x="60" y="172" width="268" height="6" rx="3" fill="url(#tlAccent)"/>

    <!-- prompt line 2 -->
    <text x="60" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4ade80">❯</text>
    <rect x="76" y="200" width="34" height="8" rx="4" fill="#7dd3fc"/>
    <rect x="118" y="200" width="118" height="8" rx="4" fill="#e2e8f0" fill-opacity="0.6"/>

    <!-- results -->
    <rect x="60" y="226" width="210" height="7" rx="3.5" fill="#2b3750" fill-opacity="0.8"/>
    <rect x="60" y="243" width="164" height="7" rx="3.5" fill="#2b3750" fill-opacity="0.6"/>
    <rect x="60" y="260" width="196" height="7" rx="3.5" fill="#2b3750" fill-opacity="0.45"/>

    <!-- caret -->
    <rect x="60" y="282" width="9" height="12" rx="2" fill="#38bdf8" fill-opacity="0.9"/>
  </g>

  <!-- floating command palette -->
  <g filter="url(#tlShadowSm)">
    <rect x="286" y="222" width="248" height="146" rx="12" fill="url(#tlPalette)"/>
    <rect x="286" y="222" width="248" height="146" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

  <!-- palette search field -->
  <rect x="302" y="238" width="216" height="26" rx="8" fill="#0f1729"/>
  <circle cx="317" cy="251" r="5" fill="none" stroke="#7dd3fc" stroke-width="1.6"/>
  <line x1="321" y1="255" x2="325" y2="259" stroke="#7dd3fc" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="334" y="248" width="74" height="6" rx="3" fill="#94a3b8" fill-opacity="0.7"/>

  <!-- palette rows -->
  <rect x="302" y="274" width="216" height="24" rx="7" fill="#2563eb" fill-opacity="0.20"/>
  <rect x="302" y="274" width="3" height="24" rx="1.5" fill="url(#tlAccent)"/>
  <rect x="316" y="283" width="88" height="6" rx="3" fill="#dbeafe" fill-opacity="0.85"/>
  <rect x="412" y="283" width="40" height="6" rx="3" fill="#64748b"/>

  <rect x="316" y="309" width="112" height="6" rx="3" fill="#64748b" fill-opacity="0.8"/>
  <rect x="436" y="309" width="26" height="6" rx="3" fill="#3b4a6b"/>

  <rect x="316" y="333" width="76" height="6" rx="3" fill="#64748b" fill-opacity="0.55"/>
  <rect x="402" y="333" width="52" height="6" rx="3" fill="#3b4a6b" fill-opacity="0.8"/>

  <!-- floating tool chips -->
  <g opacity="0.95">
    <rect x="44" y="328" width="86" height="28" rx="14" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="63" cy="342" r="4" fill="#34d399"/>
    <rect x="74" y="339" width="42" height="6" rx="3" fill="#7c8db0"/>
  </g>
  <g opacity="0.95">
    <rect x="452" y="46" width="82" height="26" rx="13" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="469" cy="59" r="4" fill="#38bdf8"/>
    <rect x="479" y="56" width="44" height="6" rx="3" fill="#7c8db0"/>
  </g>
</svg>
